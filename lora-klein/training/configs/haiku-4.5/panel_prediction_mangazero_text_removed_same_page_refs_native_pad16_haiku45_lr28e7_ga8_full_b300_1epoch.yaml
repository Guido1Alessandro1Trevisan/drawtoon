job: extension
config:
  name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_haiku45_lr28e7_ga8_full_b300_1epoch
  process:
  - type: sd_trainer
    name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_haiku45_lr28e7_ga8_full_b300_1epoch
    training_folder: /root/ai-toolkit/modal_output
    sample_copy_root: /root/ai-toolkit/modal_output/validate
    device: cuda:0
    trigger_word: ''
    save:
      dtype: bf16
      save_every: 0
      max_step_saves_to_keep: 8
      save_format: diffusers
    logging:
      use_ui_logger: true
      log_step_timing: true
    datasets:
    - type: manifest
      local_cache_dir: /root/training/datasets_cache/drawtoon_panel_sample_cache
      caption_dropout_rate: 0.0
      shuffle_tokens: false
      resolution: 768
      buckets: false
      bucket_tolerance: 16
      num_workers: 4
      prefetch_factor: 2
      max_character_refs: 5
      cache_latents: false
      cache_latents_to_disk: false
    train:
      batch_size: 1
      steps: 40000
      gradient_accumulation_steps: 8
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      attention_backend: flash
      noise_scheduler: flowmatch
      timestep_type: shift
      optimizer: adafactor
      lr: 2.8e-06
      lr_scheduler: constant_with_warmup
      lr_scheduler_params: {}
      skip_first_sample: true
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
    model:
      name_or_path: black-forest-labs/FLUX.2-klein-base-9B
      arch: flux2_klein_9b
      quantize: false
      quantize_te: false
      low_vram: false
      only_if_contains:
      - transformer.double_blocks.
      - transformer.single_blocks.
    sample:
      sampler: flowmatch
      sample_every: 0
      width: 768
      height: 768
      prompts: []
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4.0
      sample_steps: 50
meta:
  name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_haiku45_lr28e7_ga8_full_b300_1epoch
  version: '1.0'
  description: Full FLUX.2 Klein 9B MangaZero fine-tune on text-removed page PNGs with Haiku 4.5 captions, same-page character references, current character-outline and text-region control encoding, gradient accumulation 8, LR 2.8e-6, one epoch, no validation during training.
drawtoon:
  bucket: drawtoon
  pages_prefix: datasets/pages/text_removed
  annotations_prefix: datasets/annotations/magi_v3
  captions_prefix: captions
  caption_run: haiku45_mangazero_page_panel_v1
  caption_field: caption
  caption_format: text
  include_chapter_regex: _mangazero$
