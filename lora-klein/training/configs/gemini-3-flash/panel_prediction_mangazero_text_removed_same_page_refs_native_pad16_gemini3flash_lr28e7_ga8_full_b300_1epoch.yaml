job: extension
config:
  name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_gemini3flash_lr28e7_ga8_full_b300_1epoch
  process:
  - type: sd_trainer
    name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_gemini3flash_lr28e7_ga8_full_b300_1epoch
    save:
      dtype: bf16
      save_every: 0           # 0 -> runtime fills with steps_per_epoch (run_modal.py:3505)
      max_step_saves_to_keep: 4
      save_format: diffusers
    logging:
      use_ui_logger: true
      log_step_timing: true
    datasets:
    - type: manifest
      local_cache_dir: /root/training/datasets_cache/drawtoon_panel_sample_cache
      resolution: 768
      buckets: false
      num_workers: 4
      max_character_refs: 5
    train:
      batch_size: 1
      gradient_accumulation_steps: 8
      attention_backend: flash
      noise_scheduler: flowmatch
      timestep_type: shift
      optimizer: adafactor
      lr: 2.8e-06
      lr_scheduler: constant_with_warmup
      dtype: bf16
    model:
      name_or_path: black-forest-labs/FLUX.2-klein-base-9B
      arch: flux2_klein_9b
      only_if_contains:
      - transformer.double_blocks.
      - transformer.single_blocks.
    sample:
      sample_every: 1000
      guidance_scale: 4.0
      sample_steps: 50
      seed: 42
      walk_seed: true
meta:
  name: drawtoon_flux2_klein9b_mangazero_text_removed_panel_prediction_native_pad16_gemini3flash_lr28e7_ga8_full_b300_1epoch
  version: '1.0'
  description: Full FLUX.2 Klein 9B MangaZero fine-tune on text-removed page PNGs with Gemini 3 Flash captions, same-page character references, character-outline + text-region + silver speech-bubble-tail control encoding (MAGI v3 inferred tails merged into magi_v3), gradient accumulation 8, LR 2.8e-6, one epoch on 8xH200 DDP. Fresh start from FLUX.2-klein-base-9B.
drawtoon:
  bucket: drawtoon
  pages_prefix: datasets/pages/text_removed
  annotations_prefix: datasets/annotations/magi_v3
  captions_prefix: captions
  caption_run: gemini3_flash_page_panel_v1
  caption_field: caption
  caption_format: text
  include_chapter_regex: _mangazero_manga$
