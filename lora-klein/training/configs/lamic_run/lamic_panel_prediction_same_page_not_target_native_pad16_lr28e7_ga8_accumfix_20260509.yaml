job: extension
config:
  name: mangazero_flux2_klein9b_lamic_panel_prediction_same_page_not_target_native_pad16_lr28e7_ga8_accumfix_20260509
  process:
  - type: sd_trainer
    name: mangazero_flux2_klein9b_lamic_panel_prediction_same_page_not_target_native_pad16_lr28e7_ga8_accumfix_20260509
    training_folder: /root/ai-toolkit/modal_output
    sample_copy_root: /root/ai-toolkit/modal_output/validate
    device: cuda:0
    trigger_word: ''
    save:
      dtype: bf16
      save_every: 10000
      max_step_saves_to_keep: 5
      save_format: diffusers
    logging:
      use_ui_logger: true
      log_step_timing: true
    datasets:
    - type: manifest
      local_cache_dir: /root/training/datasets_cache/drawtoon_lamic_sample_cache
      caption_dropout_rate: 0.0
      shuffle_tokens: false
      resolution: 768
      buckets: false
      bucket_tolerance: 16
      num_workers: 4
      prefetch_factor: 2
      max_character_refs: 6
      cache_latents: false
      cache_latents_to_disk: false
    train:
      batch_size: 1
      steps: 40000
      gradient_accumulation_steps: 8
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adafactor
      lr: 2.8e-06
      lr_scheduler: constant_with_warmup
      lr_scheduler_params:
        num_warmup_steps: 300
      skip_first_sample: true
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
    model:
      name_or_path: black-forest-labs/FLUX.2-klein-base-9B
      arch: flux2_klein_9b
      quantize: false
      quantize_te: false
      low_vram: false
      only_if_contains:
      - transformer.double_blocks.
      - transformer.single_blocks.
    sample:
      sampler: flowmatch
      sample_every: 300
      width: 768
      height: 768
      prompts: []
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 50
meta:
  name: mangazero_flux2_klein9b_lamic_panel_prediction_same_page_not_target_native_pad16_lr28e7_ga8_accumfix_20260509
  version: '1.0'
  description: LAMIC panel prediction from native pad-16 MangaZero panels, same-page
    non-target character references, GPT-5.4-mini target-panel captions, 2.8e-6 learning
    rate, corrected gradient accumulation 8, validation every 300 steps, and on-the-fly
    VAE/reference encoding.
drawtoon:
  bucket: drawtoon
  pages_prefix: datasets/pages/filtered
  annotations_prefix: datasets/annotations/magi_v3
  captions_prefix: captions
  caption_run: haiku45_mangazero_page_lamic_v1
  include_chapter_regex: _mangazero$
