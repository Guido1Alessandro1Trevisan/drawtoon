AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Drawtoon panel-layout JSONL dataset builder. Reads source captions + short captions; writes train.jsonl + val.jsonl to drawtoon-layousyn.

Parameters:
  SourceBucketName:
    Type: String
    Default: drawtoon
  OutputBucketName:
    Type: String
    Default: drawtoon-layousyn
  PythonRuntime:
    Type: String
    Default: python3.12

Globals:
  Function:
    Runtime: !Ref PythonRuntime
    Architectures:
      - arm64
    Timeout: 900
    MemorySize: 1536
    Tracing: Active
    CodeUri: ./
    Environment:
      Variables:
        SOURCE_BUCKET_NAME: !Ref SourceBucketName
        OUTPUT_BUCKET_NAME: !Ref OutputBucketName

Resources:
  PrepareBuildConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.prepare_build_config
      MemorySize: 2048
      Timeout: 600
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${SourceBucketName}
                - !Sub arn:aws:s3:::${SourceBucketName}/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${OutputBucketName}
                - !Sub arn:aws:s3:::${OutputBucketName}/*

  BuildPagePanelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.build_page_panels
      MemorySize: 1024
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${SourceBucketName}
                - !Sub arn:aws:s3:::${SourceBucketName}/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${OutputBucketName}
                - !Sub arn:aws:s3:::${OutputBucketName}/*

  FinalizeDatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.finalize_dataset
      MemorySize: 8192
      Timeout: 900
      EphemeralStorage:
        Size: 4096
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource:
                - !Sub arn:aws:s3:::${OutputBucketName}
                - !Sub arn:aws:s3:::${OutputBucketName}/*

  BuildPanelDatasetStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachines/build_panel_dataset.asl.json
      DefinitionSubstitutions:
        PrepareBuildConfigArn: !GetAtt PrepareBuildConfigFunction.Arn
        BuildPagePanelsArn: !GetAtt BuildPagePanelsFunction.Arn
        FinalizeDatasetArn: !GetAtt FinalizeDatasetFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PrepareBuildConfigFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BuildPagePanelsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinalizeDatasetFunction
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:StopExecution
                - states:RedriveExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:*:*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${SourceBucketName}
                - !Sub arn:aws:s3:::${SourceBucketName}/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: !Sub arn:aws:s3:::${OutputBucketName}/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:aws:s3:::${OutputBucketName}

Outputs:
  BuildPanelDatasetStateMachineArn:
    Value: !Ref BuildPanelDatasetStateMachine
