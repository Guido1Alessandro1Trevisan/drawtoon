AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Drawtoon manga/manwa page filtering workflow using Step Functions Distributed Map.

Parameters:
  DatasetBucketName:
    Type: String
    Default: drawtoon
  PythonRuntime:
    Type: String
    Default: python3.11
  DefaultClassificationModel:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0

Globals:
  Function:
    Runtime: !Ref PythonRuntime
    Timeout: 900
    MemorySize: 1536
    Tracing: Active
    CodeUri: ./
    Environment:
      Variables:
        DATASET_BUCKET_NAME: !Ref DatasetBucketName
        DEFAULT_CLASSIFICATION_MODEL: !Ref DefaultClassificationModel

Resources:
  PrepareMangaFilterConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.prepare_manga_filter_config
      MemorySize: 1024
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${DatasetBucketName}
                - !Sub arn:aws:s3:::${DatasetBucketName}/*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
              Resource: "*"

  FilterMangaPageBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.filter_manga_page_batch
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${DatasetBucketName}
                - !Sub arn:aws:s3:::${DatasetBucketName}/*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
              Resource: "*"

  FinalizeMangaFilterRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers.finalize_manga_filter_run
      MemorySize: 2048
      Timeout: 900
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${DatasetBucketName}
                - !Sub arn:aws:s3:::${DatasetBucketName}/*

  FilterMangaPagesStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachines/filter_manga_pages.asl.json
      DefinitionSubstitutions:
        PrepareMangaFilterConfigArn: !GetAtt PrepareMangaFilterConfigFunction.Arn
        FilterMangaPageBatchArn: !GetAtt FilterMangaPageBatchFunction.Arn
        FinalizeMangaFilterRunArn: !GetAtt FinalizeMangaFilterRunFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PrepareMangaFilterConfigFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FilterMangaPageBatchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinalizeMangaFilterRunFunction
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:StopExecution
                - states:RedriveExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:*:*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: !Sub arn:aws:s3:::${DatasetBucketName}/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:aws:s3:::${DatasetBucketName}

Outputs:
  FilterMangaPagesStateMachineArn:
    Value: !Ref FilterMangaPagesStateMachine
